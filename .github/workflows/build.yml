name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: LibreHardwareMonitor из NuGet
        shell: pwsh
        run: |
          dotnet build packaging/lhm/lhm.csproj -c Release -o build/lhm-out
          New-Item -ItemType Directory -Force lhm | Out-Null
          Copy-Item build/lhm-out/*.dll lhm/
          Remove-Item lhm/lhm.dll -ErrorAction SilentlyContinue
          Get-ChildItem lhm | Select-Object Name, Length

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        run: python -m pytest -q

      - name: Проверка датчиков
        run: python tools/smoke_windows.py

      - name: Сборка exe (один файл)
        shell: pwsh
        run: |
          $env:TURMON_ONEFILE = "1"
          pyinstaller --noconfirm --distpath dist packaging/turmon.spec

      - name: Сборка папкой
        shell: pwsh
        run: |
          $env:TURMON_ONEFILE = "0"
          pyinstaller --noconfirm --distpath dist-dir --workpath build/pyi-dir packaging/turmon.spec
          Compress-Archive -Path dist-dir/TuringMonitorRU -DestinationPath dist/TuringMonitorRU-portable.zip

      - name: Проверка запуска exe
        shell: pwsh
        run: |
          $p = Start-Process dist/TuringMonitorRU.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Get-Content "$env:APPDATA/TuringMonitorRU/turmon.log"; throw "exe завершился с кодом $($p.ExitCode)" }
          Get-Content "$env:APPDATA/TuringMonitorRU/turmon.log"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TuringMonitorRU
          path: |
            dist/TuringMonitorRU.exe
            dist/TuringMonitorRU-portable.zip

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TuringMonitorRU.exe
            dist/TuringMonitorRU-portable.zip
