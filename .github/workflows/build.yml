name: Сборка

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: LibreHardwareMonitor из NuGet
        shell: pwsh
        run: |
          dotnet build packaging/lhm/lhm.csproj -c Release -o build/lhm-out
          New-Item -ItemType Directory -Force lhm | Out-Null
          Copy-Item build/lhm-out/*.dll lhm/
          Remove-Item lhm/lhm.dll -ErrorAction SilentlyContinue
          if (-not (Test-Path lhm/LibreHardwareMonitorLib.dll)) {
            $src = Get-ChildItem -Recurse "$env:USERPROFILE/.nuget/packages/librehardwaremonitorlib" -Filter LibreHardwareMonitorLib.dll |
              Where-Object { $_.FullName -match 'win-x64\\lib\\net472' } | Select-Object -First 1
            if ($src) { Copy-Item $src.FullName lhm/ }
          }
          $files = (Get-ChildItem lhm | ForEach-Object { "$($_.Name) $($_.Length)" }) -join "%0A"
          $pkg = "$env:USERPROFILE/.nuget/packages/librehardwaremonitorlib"
          $all = (Get-ChildItem -Recurse $pkg -Filter *.dll | ForEach-Object { $_.FullName }) -join "%0A"
          Write-Output "::notice title=lhm files::$files"
          if (-not (Test-Path lhm/LibreHardwareMonitorLib.dll)) { Write-Output "::error title=lhm::нет LibreHardwareMonitorLib.dll%0A$all"; exit 1 }

      - name: Драйвер PawnIO (установщик)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe" -OutFile lhm/PawnIO_setup.exe
          $sig = Get-AuthenticodeSignature lhm/PawnIO_setup.exe
          Write-Output "::notice title=pawnio::$((Get-Item lhm/PawnIO_setup.exe).Length) байт, подпись: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "подпись PawnIO_setup.exe недействительна" }

      - name: PresentMon (FPS в играх)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/GameTechDev/PresentMon/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "не найден консольный PresentMon в $($rel.tag_name): $($rel.assets.name -join ', ')" }
          New-Item -ItemType Directory -Force presentmon | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile presentmon/PresentMon.exe
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/GameTechDev/PresentMon/main/LICENSE.txt" -OutFile presentmon/LICENSE.txt
          $sig = Get-AuthenticodeSignature presentmon/PresentMon.exe
          Write-Output "::notice title=presentmon::$($asset.name) $($asset.size) байт, подпись: $($sig.Status) $($sig.SignerCertificate.Subject)"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        run: python -m pytest -q

      - name: Пакеты для тестового плеера
        run: pip install winrt-Windows.Media.Playback winrt-Windows.Media.Core winrt-Windows.Media winrt-Windows.Storage

      - name: Проверка датчиков
        continue-on-error: true
        run: python tools/smoke_windows.py

      - name: Сборка exe (один файл)
        shell: pwsh
        run: |
          $env:TURMON_ONEFILE = "1"
          pyinstaller --noconfirm --distpath dist packaging/turmon.spec

      - name: Сборка папкой
        shell: pwsh
        run: |
          $env:TURMON_ONEFILE = "0"
          pyinstaller --noconfirm --distpath dist-dir --workpath build/pyi-dir packaging/turmon.spec
          Compress-Archive -Path dist-dir/TuringMonitorRU -DestinationPath dist/TuringMonitorRU-portable.zip

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/turmon/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: $LASTEXITCODE" }
          Get-ChildItem dist | ForEach-Object { Write-Output "::notice title=dist::$($_.Name) $($_.Length)" }

      - name: Проверка установщика
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/TuringMonitorRU-Setup-*.exe | Select-Object -First 1
          $dir = "C:\TMtest\Мой монитор"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`" /TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "установка: $($p.ExitCode)" }
          if (-not (Test-Path "$dir\TuringMonitorRU.exe")) { throw "нет exe в выбранной папке" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\TuringMonitorRU.exe") { throw "удаление не убрало файлы" }
          Write-Output "::notice title=installer::установка в '$dir' и удаление прошли"

      - name: Проверка запуска exe
        shell: pwsh
        run: |
          $p = Start-Process dist/TuringMonitorRU.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 20
          $log = (Get-Content "$env:APPDATA/TuringMonitorRU/turmon.log" -ErrorAction SilentlyContinue) -join "%0A"
          if ($p.HasExited) { Write-Output "::error title=exe::код $($p.ExitCode)%0A$log"; exit 1 }
          Write-Output "::notice title=exe log::$log"
          $ext = "$env:APPDATA/TuringMonitorRU/browser_extension"
          if (-not (Test-Path "$ext/manifest.json")) { Write-Output "::error title=browser ext::нет папки расширения"; exit 1 }
          $tok = [regex]::Match((Get-Content "$ext/config.js" -Raw), 'token: "([0-9a-f]+)"').Groups[1].Value
          $body = @{ token = $tok; tab = 1; data = @{ title = "Проверка"; artist = "CI"; playing = $true; position = 5; duration = 50; site = "vk.com" } } | ConvertTo-Json -Depth 4
          try {
            $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:47863/media" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType "text/plain" -Headers @{ Origin = "chrome-extension://ci" }
            Write-Output "::notice title=browser ext::приёмник ответил: $($r | ConvertTo-Json -Compress)"
          } catch { Write-Output "::error title=browser ext::$_"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TuringMonitorRU
          path: |
            dist/TuringMonitorRU-Setup-*.exe
            dist/TuringMonitorRU.exe
            dist/TuringMonitorRU-portable.zip

      - name: Релиз
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TuringMonitorRU-Setup-*.exe
            dist/TuringMonitorRU.exe
            dist/TuringMonitorRU-portable.zip
